# Quality Scale tracking for Retention Cleaner integration
# https://developers.home-assistant.io/docs/core/integration-quality-scale/

rules:
  # ===== BRONZE TIER =====
  # User can set up the integration
  appropriate-library: done         # Using pathlib, asyncio - appropriate Python libraries
  brands: done                      # Already in home-assistant/brands repository
  common-modules: done              # Using HA common modules (coordinator, config_flow)
  config-flow: done                 # Full ConfigFlow implementation
  config-flow-test-coverage: todo   # Tests for config flow not yet implemented
  dependency-transparency: done     # No external dependencies
  docs-actions: done                # Actions documented (scan, cleanup buttons)
  docs-high-level-description: done # Clear description in README
  docs-installation-instructions: done # HACS installation documented
  docs-removal-instructions: done   # Uninstall instructions in README
  entity-event-setup: done          # Entities properly set up with events
  entity-name-setup: done           # Entity names follow HA standards
  entity-unique-id: done            # All entities have unique IDs
  has-entity: done                  # Integration provides entities
  runtime-data: done                # Using runtime data storage properly
  
  # ===== SILVER TIER =====
  # Stable and polished user experience
  action-exceptions: done           # Proper exception handling in actions
  config-entry-unloading: done      # Clean unload implementation
  docs-configuration-parameters: done # All config parameters documented
  docs-installation-parameters: done  # Installation parameters documented
  entity-unavailable: done          # Entities go unavailable when appropriate
  integration-owner: exempt         # Single maintainer (exemption: solo project)
  log-when-unavailable: done        # Proper logging when path unavailable
  parallel-updates: done            # Coordinator handles parallel updates
  reauthentication-flow: exempt     # Not applicable - local file system access
  test-before-configure: todo       # Config flow tests not yet implemented
  test-before-setup: todo           # Setup tests not yet implemented
  unique-config-entry: done         # Prevents duplicate config entries