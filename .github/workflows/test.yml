name: Tests

on:
  push:
    branches: ["**"]  # Alle Branches
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov voluptuous
          # Try to install Home Assistant (may timeout, but tests will skip gracefully)
          pip install --timeout 300 homeassistant || echo "Home Assistant installation failed, tests will be skipped"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check custom_components/retention_cleaner/
          ruff format --check custom_components/retention_cleaner/

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=custom_components.retention_cleaner \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=5

      - name: Coverage comment
        if: matrix.python-version == '3.12'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/ --cov=custom_components.retention_cleaner --cov-report=term >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false